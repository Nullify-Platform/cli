name: CI Go
on:
  pull_request:
    paths:
      - .github/workflows/ci-go.yml
      - '**.go'
      - go.*
      - Makefile
      - spec/**
run-name: CI Go by @${{ github.actor }} ${{ github.sha }}
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: make build
      - name: tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Extract golangci-lint version
        id: extract_version
        run: |
          version=$(sh scripts/get_golangci_lint_version.sh)
          echo "golangci_lint_version=$version" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.extract_version.outputs.golangci_lint_version }}
          args: ./cmd/... ./internal/...
      - name: generated code matches the spec
        run: |
          make generate-api
          git status --porcelain internal/api internal/commands spec
          test -z "$(git status --porcelain internal/api internal/commands spec)"
      - name: command surface keeps every command in the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if git show FETCH_HEAD:spec/command-surface.tsv > "$RUNNER_TEMP/base-surface.tsv"; then
            go run ./scripts/commandsurface --base "$RUNNER_TEMP/base-surface.tsv"
          fi
      - name: test
        run: make unit
